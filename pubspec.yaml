name: ecotra
description: "EcoTra - Production-Quality Sustainability & Transportation Carbon Tracking App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Location & Sensors
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  permission_handler: ^11.3.1

  # Local Storage & Offline-First
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation & Routing
  go_router: ^13.2.4

  # UI, Icons & Polish
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  shaders:
    - shaders/liquid_glass.frag
    - shaders/card.frag


